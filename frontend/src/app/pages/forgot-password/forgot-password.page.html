<ion-content class="forgot-content">
  <div class="forgot-container">
    <!-- Logo -->
    <div class="logo-section">
      <ion-icon name="chatbubbles-sharp" class="logo-icon"></ion-icon>
    </div>

    <!-- Title -->
    <h1 class="app-title">Microblogging</h1>

    @if (sent()) {
      <!-- Success -->
      <div class="forgot-form">
        <div class="status-section">
          <p class="status-text">Si el correo está registrado, vas a recibir un enlace para restablecer tu contraseña.</p>
        </div>
        <button type="button" class="forgot-button" routerLink="/login">Volver a Iniciar Sesión</button>
      </div>
    } @else {
      <!-- Form -->
      <form [formGroup]="emailForm" (ngSubmit)="onSubmit()" class="forgot-form">
        <div class="input-group">
          <label class="input-label">Email</label>
          <input
            type="email"
            placeholder="tu@email.com"
            formControlName="email"
            autocomplete="email"
            class="form-input"
          />
        </div>

        <button
          type="submit"
          class="forgot-button"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <ion-spinner name="circular" slot="start"></ion-spinner>
            Enviando...
          } @else {
            Enviar enlace
          }
        </button>

        <button type="button" class="forgot-button" routerLink="/login">Volver a Iniciar Sesión</button>
      </form>
    }

    @if (errorMessage()) {
      <div class="error-banner">
        <ion-text>{{ errorMessage() }}</ion-text>
      </div>
    }
  </div>
</ion-content>
