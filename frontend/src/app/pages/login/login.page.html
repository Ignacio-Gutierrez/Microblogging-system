<ion-content class="login-content">
  <div class="login-container">
    <!-- Logo -->
    <div class="logo-section">
      <ion-icon name="chatbubbles-sharp" class="logo-icon"></ion-icon>
    </div>

    <!-- Title -->
    <h1 class="app-title">Microblogging</h1>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="input-group">
        <label class="input-label">Usuario</label>
        <input
          type="text"
          placeholder="Ingresa tu nombre de usuario"
          formControlName="username"
          autocomplete="username"
          class="form-input"
          data-cy="login-username-input"
        />
      </div>

      <div class="input-group">
        <label class="input-label">Contraseña</label>
        <div class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Ingresa tu contraseña"
            formControlName="password"
            autocomplete="current-password"
            class="form-input"
            data-cy="login-password-input"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePassword()"
            aria-label="Mostrar u ocultar contraseña"
          >
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>

      <a class="forgot-password" (click)="onForgotPassword()" data-cy="login-forgot-password-link">¿Olvidaste tu contraseña?</a>

      <button
        type="submit"
        class="login-button"
        [disabled]="isLoading()"
        data-cy="login-submit-button"
      >
        @if (isLoading()) {
          <ion-spinner name="circular" slot="start"></ion-spinner>
          Ingresando...
        } @else {
          Ingresar
        }
      </button>
    </form>

    <!-- Register link -->
    <div class="register-section">
      <span class="register-text">¿No tienes una cuenta?</span>
      <button type="button" class="register-link" (click)="onRegisterClick()" data-cy="login-register-link">Registrarse</button>
    </div>

    <!-- Error message -->
    @if (errorMessage()) {
      <div class="error-banner" data-cy="login-error-banner">
        <ion-text>{{ errorMessage() }}</ion-text>
      </div>
    }
  </div>
</ion-content>
