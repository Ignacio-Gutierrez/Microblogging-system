<ion-content class="reset-content">
  <div class="reset-container">
    <!-- Logo -->
    <div class="logo-section">
      <ion-icon name="chatbubbles-sharp" class="logo-icon"></ion-icon>
    </div>

    <!-- Title -->
    <h1 class="app-title">Microblogging</h1>

    @if (error()) {
      <!-- Error -->
      <div class="reset-form">
        <div class="status-section">
          <p class="status-text">El enlace de restablecimiento es inválido o ya expiró.</p>
        </div>
        <button type="button" class="reset-button" routerLink="/forgot-password">Solicitar un nuevo enlace</button>
      </div>
    } @else if (success()) {
      <!-- Success -->
      <div class="reset-form">
        <div class="status-section">
          <p class="status-text">Tu contraseña fue cambiada correctamente.</p>
        </div>
        <button type="button" class="reset-button" routerLink="/login">Ir a Iniciar Sesión</button>
      </div>
    } @else {
      <!-- Form -->
      <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="reset-form">
        <div class="input-group">
          <label class="input-label">Nueva contraseña</label>
          <div class="password-field">
            <input
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Mínimo 4 caracteres"
              formControlName="newPassword"
              autocomplete="new-password"
              class="form-input"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePassword()"
              aria-label="Mostrar u ocultar contraseña"
            >
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </div>

        <div class="input-group">
          <label class="input-label">Confirmar contraseña</label>
          <div class="password-field">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              placeholder="Repetí la contraseña"
              formControlName="confirmPassword"
              autocomplete="new-password"
              class="form-input"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="toggleConfirmPassword()"
              aria-label="Mostrar u ocultar confirmación de contraseña"
            >
              <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="reset-button"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <ion-spinner name="circular" slot="start"></ion-spinner>
            Cambiando...
          } @else {
            Cambiar contraseña
          }
        </button>
      </form>
    }

    @if (errorMessage()) {
      <div class="error-banner">
        <ion-text>{{ errorMessage() }}</ion-text>
      </div>
    }
  </div>
</ion-content>
