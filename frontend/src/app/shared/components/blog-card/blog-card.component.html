<div class="blog-card">
  <ion-item button (click)="onClick()">
    <ion-icon name="file-tray" slot="start"></ion-icon>
    <ion-label>{{ blog().name }}</ion-label>

    @if (showActions()) {
      <ion-button
        [id]="actionsTriggerId"
        class="actions-button"
        fill="clear"
        slot="end"
        aria-label="Opciones del blog"
        (click)="$event.stopPropagation()"
      >
        <ion-icon name="ellipsis-vertical-sharp" slot="icon-only"></ion-icon>
      </ion-button>
    }
  </ion-item>

  @if (showActions()) {
    <ion-popover
      #actionsPopover
      class="blog-actions-popover"
      [trigger]="actionsTriggerId"
      triggerAction="click"
      side="bottom"
      alignment="end"
      [showBackdrop]="false"
      [backdropDismiss]="true"
    >
      <ng-template>
        <button type="button" class="delete-button" (click)="actionsPopover.dismiss(); requestDelete($event)">
          <ion-icon name="trash-outline"></ion-icon>
          <span>Eliminar blog</span>
        </button>
      </ng-template>
    </ion-popover>
  }
</div>
