name: microblogging

services:
  frontend:
    image: ${DOCKERHUB_NAMESPACE:-ijgutierrez}/microblogging-frontend:latest
    ports:
      - 127.0.0.1:8081:80
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ${DOCKERHUB_NAMESPACE:-ijgutierrez}/microblogging-backend:latest
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs,secret-samples
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/blog?useLegacyDatetimeCode=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_LIQUIBASE_URL=jdbc:mariadb://mariadb:3306/blog?useLegacyDatetimeCode=false
      - JHIPSTER_LOGGING_USE_JSON_FORMAT=true
      - JHIPSTER_LOGGING_LOGSTASH_ENABLED=true
      - JHIPSTER_LOGGING_LOGSTASH_HOST=elk
      - JHIPSTER_LOGGING_LOGSTASH_PORT=5000
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /management/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"\\\"status\\\":\\\"UP\\\"\" <&3'"
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      mariadb:
        condition: service_healthy
      elk:
        condition: service_healthy

  mariadb:
    image: mariadb:12.2.2
    volumes:
      - ./backend/src/main/docker/config/mariadb:/etc/mysql/conf.d:ro
    environment:
      - MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes
      - MARIADB_ALLOW_EMPTY_PASSWORD=yes
      - MARIADB_DATABASE=blog
    ports:
      - 127.0.0.1:3306:3306
    command: mariadbd --lower_case_table_names=1 --character_set_server=utf8mb4 --explicit_defaults_for_timestamp
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 10

  elk:
    image: sebp/elk
    environment:
      - ES_HEAP_SIZE=512m
      - LS_HEAP_SIZE=256m
      - ELASTICSEARCH_HOST=http://localhost
      - ELASTICSEARCH_PORT=9200
      - MAX_MAP_COUNT=262144
    volumes:
      - ./backend/src/main/docker/logstash/pipeline/:/etc/logstash/conf.d/:ro
    ports:
      - 127.0.0.1:9200:9200
      - 127.0.0.1:5000:5000
      - 127.0.0.1:5044:5044
      - 127.0.0.1:5601:5601
      - 127.0.0.1:9600:9600
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
